schema_version: 1
policy:
  prohibited_material:
    - bios-images
    - game-images
    - proprietary-sdk-material
    - leaked-source-code
    - confidential-documentation
    - cryptographic-keys
    - circumvention-material
  local_cache_policy: untracked-only
  emulator_source_policy: license-review-required
references:
  - id: sony-ee-announcement
    title: Sony Computer Entertainment Emotion Engine announcement
    url: https://sonyinteractive.com/jp/press-releases/1999/990302_3-2/
    source_class: official-publication
    role: architecture
    subsystems: [system, ee, vu, gs]
    license: Copyright Sony Interactive Entertainment; public web page
    source_code_consulted: false
    redistribution: link-only
    consulted_sections: [processor overview, published specifications]
    notes: Official high-level announcement; not an instruction-semantics source.
  - id: toshiba-ee-announcement
    title: Toshiba Emotion Engine announcement
    url: https://www.global.toshiba/ww/news/corporate/1999/03/pr0401.html
    source_class: official-publication
    role: architecture
    subsystems: [system, ee, vu, gs]
    license: Copyright Toshiba Corporation; public web page
    source_code_consulted: false
    redistribution: link-only
    consulted_sections: [processor overview, published specifications]
    notes: Independent official confirmation of the Sony and Toshiba design summary.
  - id: date2001-ee-cpu
    title: CPU for PlayStation 2
    url: https://past.date-conference.com/proceedings-archive/2001/DATE01/PDFFILES/09E_1.PDF
    source_class: official-publication
    role: architecture
    subsystems: [system, ee, r5900, vu, dmac, ipu, memory]
    license: Copyright conference paper; redistribution rights not assumed
    source_code_consulted: false
    redistribution: link-only
    consulted_sections: [system architecture, cpu core, vector units, verification]
    notes: Public paper by Sony Computer Entertainment and Toshiba engineers.
  - id: toshiba-2000-highlights
    title: Toshiba Review 2000 technical highlights
    url: https://www.global.toshiba/content/dam/toshiba/migration/corp/techReviewAssets/tech/review/2000/high2000/pdf/h0006.pdf
    source_class: official-publication
    role: architecture
    subsystems: [system, ee, r5900, vu, dmac, ipu, memory]
    license: Copyright Toshiba Corporation; redistribution rights not assumed
    source_code_consulted: false
    redistribution: link-only
    consulted_sections: [emotion engine architecture overview]
    notes: Official technical overview used to corroborate system block relationships.
  - id: ps2sdk
    title: PS2SDK homebrew development kit
    url: https://github.com/ps2dev/ps2sdk
    source_class: official-project
    role: toolchain
    subsystems: [ee, iop, dmac, gif, gs, sif, spu2, software]
    license: Academic Free License 2.0
    source_code_consulted: true
    redistribution: link-only
    consulted_sections:
      - README
      - public API documentation
      - license
      - EE toolchain sample definitions
      - EE ELF loader implementation
    notes: AFL-2.0 sources corroborate the native target and PT_LOAD-to-vaddr EE loading rule.
  - id: ps2tek
    title: PS2Tek PlayStation 2 technical documentation
    url: https://psi-rockin.github.io/ps2tek/index.html
    source_class: independent-documentation
    role: architecture
    subsystems: [ee, r5900, cop0, dmac, timers, gif, vif, vu, gs, iop, sif]
    license: Not specified by the upstream documentation repository
    source_code_consulted: false
    redistribution: link-only
    consulted_sections:
      - documentation index
      - subsystem coverage
      - EE Registers
      - EE Instruction Decoding
      - SPECIAL and MMI instruction tables
      - HI LO HI1 and LO1 register descriptions
    notes: >-
      Independently documents 128-bit EE GPRs, the doubleword instruction
      subset, and both multiply/divide register pairs.
  - id: binutils-r5900-review
    title: GNU Binutils R5900 support review
    url: https://sourceware.org/pipermail/binutils/2013-January/079862.html
    source_class: public-mailing-list
    role: toolchain
    subsystems: [r5900, fpu, mmi, elf, software]
    license: Mailing-list text; linked patch code is GNU project licensed
    source_code_consulted: true
    redistribution: link-only
    consulted_sections:
      - architecture review summary and accepted target support
      - R5900 subset exclusions
      - single-precision FPU and opcode divergence discussion
      - linked R5900 opcode table additions
      - linked R5900 assembler encoding tests
    notes: >-
      GNU-licensed opcode and test patch source was inspected for inventory and
      encoding corroboration only; no implementation structure was copied.
  - id: qemu-r5900-overview
    title: QEMU R5900 multimedia instruction overview patch review
    url: https://patchew.org/QEMU/cover.1540134918.git.noring@nocrew.org/bcc29487f67d12865795c6a357203c41a8027c23.1540134918.git.noring@nocrew.org/
    source_class: public-mailing-list
    role: architecture
    subsystems: [r5900, mmi]
    license: GPL-2.0-or-later QEMU project contribution
    source_code_consulted: true
    redistribution: link-only
    consulted_sections:
      - R5900 128-bit GPR overview comment
      - pipeline 1 multiply divide and HI1 LO1 operation inventory
    notes: Corroborates scalar-lane use and the independently encoded second multiply/divide path.
  - id: pcsx2-r5900-interpreter
    title: PCSX2 R5900 interpreter implementation
    url: https://github.com/PCSX2/pcsx2/blob/master/pcsx2/R5900OpcodeImpl.cpp
    source_class: official-project
    role: architecture
    subsystems: [r5900]
    license: GPL-3.0; repository COPYING.GPLv3 reviewed before consultation
    source_code_consulted: true
    redistribution: link-only
    consulted_sections:
      - scalar shift and immediate interpreter operations
      - DSLL interpreter operation
      - DSRL interpreter operation
      - DSRA interpreter operation
      - DSLL32 interpreter operation
      - DSRL32 interpreter operation
      - DSRA32 interpreter operation
      - DSLLV interpreter operation
      - DSRLV interpreter operation
      - DSRAV interpreter operation
      - ADDU SUBU AND OR XOR NOR SLT SLTU SLTI and SLTIU interpreter operations
      - MULT interpreter operation
      - MULTU interpreter operation
      - DIV interpreter operation
      - DIVU interpreter operation
      - MFHI interpreter operation
    notes: >-
      Corroborates R5900 scalar result widths, DSLL DSRL DSRA DSLL32 DSRL32 and DSRA32
      low-doubleword results with preserved upper lanes, immediate and six-bit
      variable shift counts, immediate or register arithmetic handling, and
      MULT and MULTU word product splitting with independent HI and LO sign
      extension plus the optional low-scalar destination, including MULTU's
      unsigned operands, DIV quotient, remainder, overflow, and zero-divisor
      results, DIVU result extension and zero-divisor behavior, and MFHI's full
      primary-HI scalar transfer; no source structure was copied.
  - id: play-emulator
    title: Play! PlayStation 2 emulator
    url: https://github.com/jpd002/Play-
    source_class: official-project
    role: architecture
    subsystems: [r5900]
    license: BSD-2-Clause; repository License.txt reviewed before consultation
    source_code_consulted: true
    redistribution: link-only
    consulted_sections:
      - MA_MIPSIV signed and unsigned 32-bit division template
      - EE DIV DIVU DIV1 and DIVU1 binding declarations
      - MA_MIPSIV MFHI operation
    notes: >-
      Independently corroborates signed and unsigned quotient and remainder
      calculation, 64-bit result extension, both operations' divisor-zero
      results, and MFHI's complete 64-bit transfer; no source structure was
      copied.
  - id: r5900-linux-div-zero-report
    title: Linux MIPS R5900 division-by-zero hardware report
    url: https://lkml.indiana.edu/hypermail/linux/kernel/1903.3/07310.html
    source_class: public-mailing-list
    role: architecture
    subsystems: [r5900]
    license: Public mailing-list message; redistribution rights not assumed
    source_code_consulted: false
    redistribution: link-only
    consulted_sections:
      - actual R5900 division-by-zero result observation
    notes: >-
      Hardware report corroborates the all-ones quotient for the common
      nonnegative dividend case; emulator evidence covers the remaining edge
      matrix.
  - id: system-v-gabi-elf
    title: System V generic ABI ELF object file format
    url: https://gabi.xinuos.com/elf/02-eheader.html
    source_class: official-publication
    role: toolchain
    subsystems: [elf, loader, software]
    license: Copyright Xinuos; public ABI specification, redistribution not assumed
    source_code_consulted: false
    redistribution: link-only
    consulted_sections:
      - ELF32 header contents
      - ELF identification
      - data encoding
      - assigned machine values
      - program header layout and PT_LOAD semantics
    notes: Primary specification for ELF identification, headers, and executable segments.
  - id: mips-iv-instruction-set
    title: MIPS IV Instruction Set Revision 3.2
    url: https://techpubs.jurassic.nl/library/manuals/2000/007-2597-001/pdf/007-2597-001.pdf
    source_class: public-archive
    role: architecture
    subsystems: [r5900, cop0, fpu]
    license: Copyright MIPS Technologies; redistribution rights not assumed
    source_code_consulted: false
    redistribution: link-only
    consulted_sections:
      - CPU architecture overview and functional instruction groups
      - instruction description notation operations and exceptions
      - CPU instruction formats and encoding tables
      - SLLV SRLV and SRAV instruction descriptions
      - LUI instruction description
      - ORI instruction description
      - ANDI instruction description
      - XORI instruction description
      - ADDIU instruction description
      - ADDU instruction description
      - SUBU instruction description
      - AND instruction description
      - OR instruction description
      - XOR instruction description
      - NOR instruction description
      - SLT instruction description
      - SLTU instruction description
      - SLTI instruction description
      - SLTIU instruction description
      - DSLL DSRL DSRA DSLL32 DSRL32 and DSRA32 instruction descriptions
      - DSLLV DSRLV and DSRAV instruction descriptions
      - DADDIU DADDU and DSUBU instruction descriptions
      - MULT MULTU DIV DIVU MFHI MFLO MTHI and MTLO instruction descriptions
      - multiply divide HI and LO result conventions
      - load store ALU jump branch miscellaneous and coprocessor summaries
    notes: Public base-ISA semantics manual; PS2Tek and GNU R5900 tables separately establish inclusion and exclusions.
  - id: mips-r10000-manual
    title: MIPS R10000 Microprocessor User's Manual
    url: https://techpubs.jurassic.nl/library/manuals/2000/007-2490-001/pdf/007-2490-001.pdf
    source_class: public-archive
    role: architecture
    subsystems: [mips, reset, r5900]
    license: Copyright MIPS Technologies; redistribution rights not assumed
    source_code_consulted: false
    redistribution: link-only
    consulted_sections: [8.1 Initialization of Logical Registers]
    notes: Reset-state caution from a different MIPS IV implementation; not R5900 semantics proof.
  - id: cocotb-development-docs
    title: Cocotb development documentation
    url: https://docs.cocotb.org/en/development/master-notes.html
    source_class: tool-documentation
    role: verification
    subsystems: [verification, simulation]
    license: BSD-3-Clause
    source_code_consulted: true
    redistribution: link-only
    consulted_sections: [Python 3.14 support notes, simulator shutdown handling]
